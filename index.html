<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriFact AI - Perplexity Powered</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <div class="w-full sm:max-w-md bg-slate-900 sm:rounded-3xl shadow-2xl flex flex-col min-h-screen sm:min-h-[850px] border border-slate-800 overflow-hidden relative">
        
        <header class="px-5 py-4 flex items-center justify-between border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-20">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30 text-white font-bold text-lg">V</div>
                <div>
                    <h1 class="font-bold text-base tracking-tight text-white">VeriFact AI</h1>
                    <p class="text-[10px] text-purple-400 font-medium uppercase tracking-wider">Perplexity Sonar Pro</p>
                </div>
            </div>
            <button onclick="resetApp()" class="text-xs text-slate-300 hover:text-white bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 transition cursor-pointer">
                Réinitialiser
            </button>
        </header>

        <main class="flex-1 p-5 flex flex-col space-y-5 overflow-y-auto pb-10">

            <!-- Formulaire d'analyse -->
            <div id="upload-section" class="flex flex-col space-y-4">
                <div class="text-center space-y-1 my-2">
                    <h2 class="text-xl font-bold text-white">Fact-Checking en Direct</h2>
                    <p class="text-xs text-slate-400">Importe une image et décris le sujet pour lancer l'enquête web.</p>
                </div>

                <div class="border-2 border-dashed border-slate-700 hover:border-purple-500 bg-slate-800/40 rounded-2xl p-6 flex flex-col items-center justify-center text-center relative cursor-pointer group">
                    <input type="file" id="file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-20">
                    <div class="w-12 h-12 rounded-2xl bg-purple-500/10 text-purple-400 flex items-center justify-center mb-2 group-hover:scale-110 transition">
                        📷
                    </div>
                    <p id="file-label" class="text-sm font-semibold text-slate-200">Choisir une image (optionnel)</p>
                </div>

                <!-- Champ de description du sujet -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Sujet ou affirmation à vérifier :</label>
                    <input type="text" id="query-input" placeholder="Ex: Rumeur sur le carburant, déclaration de..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>

                <!-- Sélecteur de domaine -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Domaine :</label>
                    <select id="domain-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500">
                        <option value="actualité générale">Actualité générale</option>
                        <option value="politique">Politique</option>
                        <option value="santé et science">Santé & Science</option>
                        <option value="technologie">Technologie</option>
                    </select>
                </div>

                <button onclick="startVerification()" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-purple-600/30 transition cursor-pointer mt-2">
                    Lancer l'enquête Perplexity
                </button>
            </div>

            <!-- Loader -->
            <div id="loader-section" class="hidden flex-col items-center justify-center py-20 space-y-4">
                <div class="w-12 h-12 rounded-full border-4 border-purple-500/20 border-t-purple-500 animate-spin"></div>
                <p class="text-sm font-medium text-slate-300">Recherche sur le web en cours...</p>
            </div>

            <!-- Résultats -->
            <div id="result-section" class="hidden flex-col space-y-4">
                <div id="verdict-banner" class="p-4 rounded-2xl border flex items-center justify-between">
                    <div>
                        <span id="verdict-tag" class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full"></span>
                        <h2 id="verdict-title" class="text-base font-bold mt-1 text-white"></h2>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-400 block">Confiance</span>
                        <span id="trust-score" class="text-lg font-black text-emerald-400">88%</span>
                    </div>
                </div>

                <div id="image-preview-container" class="rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 aspect-video relative hidden">
                    <img id="result-image" src="" alt="Média" class="w-full h-full object-cover">
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Rapport d'enquête</h3>
                    <div id="findings-list" class="space-y-2"></div>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Sources web citées</h3>
                    <div id="sources-list" class="space-y-1.5"></div>
                </div>

                <button onclick="resetApp()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-sm transition cursor-pointer border border-slate-700">
                    Nouvelle vérification
                </button>
            </div>

        </main>
    </div>

    <script>
        let selectedImageBase64 = null;

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('file-label').innerText = "Image sélectionnée : " + file.name;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                selectedImageBase64 = uploadEvent.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        });

        async function startVerification() {
            const query = document.getElementById('query-input').value.trim();
            const domain = document.getElementById('domain-select').value;

            if (!query && !selectedImageBase64) {
                alert("Veuillez saisir un sujet à vérifier ou importer une image.");
                return;
            }

            showLoader();

            try {
                const response = await fetch('/.netlify/functions/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageBase64: selectedImageBase64 || "",
                        query: query,
                        domain: domain
                    })
                });

                const data = await response.json();
                hideLoader();
                renderResult(data);

            } catch (err) {
                hideLoader();
                alert("Erreur de communication avec le serveur.");
            }
        }

        function showLoader() {
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('loader-section').classList.add('flex');
        }

        function hideLoader() {
            document.getElementById('loader-section').classList.remove('flex');
            document.getElementById('loader-section').classList.add('hidden');
        }

        function renderResult(data) {
            document.getElementById('result-section').classList.remove('hidden');

            if (selectedImageBase64) {
                document.getElementById('result-image').src = "data:image/jpeg;base64," + selectedImageBase64;
                document.getElementById('image-preview-container').classList.remove('hidden');
            }

            document.getElementById('verdict-banner').className = "p-4 rounded-2xl border flex items-center justify-between bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
            document.getElementById('verdict-tag').className = "text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300";
            document.getElementById('verdict-tag').innerText = data.badge || "VÉRIFIÉ";
            document.getElementById('verdict-title').innerText = data.title || "Rapport d'enquête";
            document.getElementById('trust-score').innerText = data.score || "85%";

            const findingsList = document.getElementById('findings-list');
            findingsList.innerHTML = "";
            if (data.findings) {
                data.findings.forEach(f => {
                    findingsList.innerHTML += `
                        <div class="bg-slate-800/60 border border-slate-700/60 p-3 rounded-xl text-xs space-y-1">
                            <h4 class="font-bold text-slate-200">${f.title}</h4>
                            <p class="text-slate-400">${f.desc}</p>
                        </div>
                    `;
                });
            }

            const sourcesList = document.getElementById('sources-list');
            sourcesList.innerHTML = "";
            if (data.sources) {
                data.sources.forEach(s => {
                    sourcesList.innerHTML += `
                        <a href="${s.note}" target="_blank" class="block bg-slate-800/40 hover:bg-slate-800 border border-slate-700/50 p-2.5 rounded-xl text-xs transition">
                            <span class="font-bold text-purple-400 block">${s.name}</span>
                            <span class="text-slate-400 truncate block text-[10px] mt-0.5">${s.note}</span>
                        </a>
                    `;
                });
            }
        }

        function resetApp() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('loader-section').classList.remove('flex');
            document.getElementById('loader-section').classList.add('hidden');
            document.getElementById('upload-section').classList.remove('hidden');
            document.getElementById('query-input').value = '';
            document.getElementById('file-input').value = '';
            document.getElementById('file-label').innerText = "Choisir une image (optionnel)";
            document.getElementById('image-preview-container').classList.add('hidden');
            selectedImageBase64 = null;
        }
    </script>
</body>
</html>
