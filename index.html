<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriFact AI - Live Web Checker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1117; color: #c9d1d9; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-xl p-6 border border-slate-800 space-y-6">
        <div>
            <h1 class="text-xl font-bold text-white">VeriFact AI Pro</h1>
            <p class="text-xs text-slate-400">Vérification connectée en direct</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Que voulez-vous vérifier ?</label>
                <input type="text" id="user-query" placeholder="Ex: Rumeur sur la fermeture des hôpitaux..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Domaine</label>
                <select id="user-domain" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 focus:outline-none">
                    <option value="Actualité">Actualité</option>
                    <option value="Politique">Politique</option>
                    <option value="Santé">Santé</option>
                </select>
            </div>

            <button onclick="verifyFact()" id="verify-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition cursor-pointer">
                Lancer la vérification web
            </button>
        </div>

        <div id="loader" class="hidden text-center py-8 space-y-2">
            <div class="inline-block w-8 h-8 animate-spin rounded-full border-4 border-blue-600 border-t-transparent"></div>
            <p class="text-xs text-slate-400">Analyse et recherche en cours...</p>
        </div>

        <div id="result" class="hidden space-y-4 pt-4 border-t border-slate-800">
            <div id="badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase"></div>
            <h2 id="title" class="text-lg font-bold text-white"></h2>
            <p id="findings" class="text-sm text-slate-300 bg-slate-950 p-4 rounded-xl border border-slate-800 leading-relaxed"></p>
            
            <div>
                <h3 class="text-xs font-bold uppercase text-slate-400 mb-2">Sources trouvées :</h3>
                <ul id="sources-list" class="space-y-1.5 text-xs text-blue-400 underline"></ul>
            </div>
        </div>
    </div>

    <script>
        async function verifyFact() {
            const query = document.getElementById('user-query').value;
            const domain = document.getElementById('user-domain').value;

            if (!query.trim()) {
                alert("Veuillez entrer une affirmation à vérifier.");
                return;
            }

            // UI Loading
            document.getElementById('verify-btn').disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');

            try {
                const response = await fetch('/.netlify/functions/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, domain })
                });

                const data = await response.json();
                displayResults(data);
            } catch (err) {
                alert("Erreur lors de l'appel serveur.");
            } finally {
                document.getElementById('verify-btn').disabled = false;
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function displayResults(data) {
            const resDiv = document.getElementById('result');
            resDiv.classList.remove('hidden');

            const badge = document.getElementById('badge');
            badge.innerText = data.badge;
            if(data.badge === 'VÉRIFIÉ') badge.className = 'px-3 py-1 rounded-full text-xs font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            else if(data.badge === 'INFOX') badge.className = 'px-3 py-1 rounded-full text-xs font-bold uppercase bg-red-500/20 text-red-400 border border-red-500/30';
            else badge.className = 'px-3 py-1 rounded-full text-xs font-bold uppercase bg-amber-500/20 text-amber-400 border border-amber-500/30';

            document.getElementById('title').innerText = data.title;
            document.getElementById('findings').innerText = data.findings;

            const sourcesList = document.getElementById('sources-list');
            sourcesList.innerHTML = '';
            if(data.sources && data.sources.length > 0) {
                data.sources.forEach(url => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="${url}" target="_blank" class="truncate block hover:text-blue-300">🔗 ${url}</a>`;
                    sourcesList.appendChild(li);
                });
            } else {
                sourcesList.innerHTML = '<li class="text-slate-500">Aucune source directe trouvée.</li>';
            }
        }
    </script>
</body>
</html>
